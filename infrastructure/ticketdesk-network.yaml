AWSTemplateFormatVersion: "2010-09-09"

Description: >
  TicketDesk networking infrastructure with a VPC,
  public and private subnets across two Availability Zones.

Parameters:

  VpcCidr:
    Type: String
    Default: 20.0.0.0/16

  PublicSubnet1Cidr:
    Type: String
    Default: 20.0.1.0/24

  PublicSubnet2Cidr:
    Type: String
    Default: 20.0.2.0/24

  PrivateSubnet1Cidr:
    Type: String
    Default: 20.0.11.0/24

  PrivateSubnet2Cidr:
    Type: String
    Default: 20.0.12.0/24

Resources:

  # --------------------------------------------------
  # VPC
  # --------------------------------------------------

  TicketDeskVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: TicketDesk-VPC
        - Key: Project
          Value: ticketdesk
        - Key: Owner
          Value: Mouktik
        - Key: Environment
          Value: dev
        - Key: CostCenter
          Value: TicketDesk

  # --------------------------------------------------
  # Internet Gateway
  # --------------------------------------------------

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: TicketDesk-IGW
        - Key: Project
          Value: ticketdesk
        - Key: Owner
          Value: Mouktik
        - Key: Environment
          Value: dev
        - Key: CostCenter
          Value: TicketDesk

  AttachInternetGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref TicketDeskVPC
      InternetGatewayId: !Ref InternetGateway

  # --------------------------------------------------
  # Public Subnets
  # --------------------------------------------------

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref TicketDeskVPC
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Select
        - 0
        - !GetAZs ""
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: TicketDesk-Public-Subnet-1
        - Key: Project
          Value: ticketdesk
        - Key: Owner
          Value: Mouktik
        - Key: Environment
          Value: dev
        - Key: CostCenter
          Value: TicketDesk

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref TicketDeskVPC
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Select
        - 1
        - !GetAZs ""
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: TicketDesk-Public-Subnet-2
        - Key: Project
          Value: ticketdesk
        - Key: Owner
          Value: Mouktik
        - Key: Environment
          Value: dev
        - Key: CostCenter
          Value: TicketDesk

  # --------------------------------------------------
  # Private Subnets
  # --------------------------------------------------

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref TicketDeskVPC
      CidrBlock: !Ref PrivateSubnet1Cidr
      AvailabilityZone: !Select
        - 0
        - !GetAZs ""
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: TicketDesk-Private-Subnet-1
        - Key: Project
          Value: ticketdesk
        - Key: Owner
          Value: Mouktik
        - Key: Environment
          Value: dev
        - Key: CostCenter
          Value: TicketDesk

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref TicketDeskVPC
      CidrBlock: !Ref PrivateSubnet2Cidr
      AvailabilityZone: !Select
        - 1
        - !GetAZs ""
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: TicketDesk-Private-Subnet-2
        - Key: Project
          Value: ticketdesk
        - Key: Owner
          Value: Mouktik
        - Key: Environment
          Value: dev
        - Key: CostCenter
          Value: TicketDesk

  # --------------------------------------------------
  # Public Route Table
  # --------------------------------------------------

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref TicketDeskVPC
      Tags:
        - Key: Name
          Value: TicketDesk-Public-RouteTable
        - Key: Project
          Value: ticketdesk
        - Key: Owner
          Value: Mouktik
        - Key: Environment
          Value: dev
        - Key: CostCenter
          Value: TicketDesk

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachInternetGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet1

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet2

  # --------------------------------------------------
  # Private Route Table
  # --------------------------------------------------

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref TicketDeskVPC
      Tags:
        - Key: Name
          Value: TicketDesk-Private-RouteTable

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet1

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet2

Outputs:

  VpcId:
    Description: TicketDesk VPC ID
    Value: !Ref TicketDeskVPC
    Export:
      Name: TicketDesk-VpcId

  PublicSubnet1Id:
    Description: Public subnet 1 ID
    Value: !Ref PublicSubnet1
    Export:
      Name: TicketDesk-PublicSubnet1

  PublicSubnet2Id:
    Description: Public subnet 2 ID
    Value: !Ref PublicSubnet2
    Export:
      Name: TicketDesk-PublicSubnet2

  PrivateSubnet1Id:
    Description: Private subnet 1 ID
    Value: !Ref PrivateSubnet1
    Export:
      Name: TicketDesk-PrivateSubnet1

  PrivateSubnet2Id:
    Description: Private subnet 2 ID
    Value: !Ref PrivateSubnet2
    Export:
      Name: TicketDesk-PrivateSubnet2

  InternetGatewayId:
    Description: Internet Gateway ID
    Value: !Ref InternetGateway