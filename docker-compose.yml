services:
  db:
    image: postgres:16
    container_name: ticketdesk-db

    environment:
      POSTGRES_DB: ticketdesk
      POSTGRES_USER: ticketdesk
      POSTGRES_PASSWORD: ticketdesk_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketdesk -d ticketdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Ticketdeck_backend

    container_name: ticketdesk-api

    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ticketdesk
      DATABASE_USER: ticketdesk
      DATABASE_PASSWORD: ticketdesk_dev_password
      AWS_REGION: ap-south-1
      S3_BUCKET: ticketdesk-attachments-bucket

    volumes:
      - "${USERPROFILE}/.aws:/home/appuser/.aws:ro"

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: