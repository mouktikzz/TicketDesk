AWSTemplateFormatVersion: "2010-09-09"

Description: >
  TicketDesk security groups for the application backend
  and PostgreSQL database.

Resources:

  # --------------------------------------------------
  # Backend Security Group
  # --------------------------------------------------

  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for TicketDesk backend
      VpcId:
        Fn::ImportValue: TicketDesk-VpcId

      Tags:
        - Key: Name
          Value: TicketDesk-Backend-SG

  # --------------------------------------------------
  # RDS PostgreSQL Security Group
  # --------------------------------------------------

  RDSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for TicketDesk PostgreSQL
      VpcId:
        Fn::ImportValue: TicketDesk-VpcId

      Tags:
        - Key: Name
          Value: TicketDesk-RDS-SG

  # --------------------------------------------------
  # Backend HTTP Access
  # --------------------------------------------------

  BackendHTTPIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref BackendSecurityGroup
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 8000
      CidrIp: 0.0.0.0/0
      Description: Temporary public access to FastAPI

  # --------------------------------------------------
  # Backend HTTPS
  # --------------------------------------------------

  BackendHTTPSIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref BackendSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0
      Description: HTTPS access to backend

  # --------------------------------------------------
  # RDS PostgreSQL
  # --------------------------------------------------

  RDSPostgreSQLIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RDSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432

      SourceSecurityGroupId: !Ref BackendSecurityGroup

      Description: PostgreSQL access only from TicketDesk backend

Outputs:

  BackendSecurityGroupId:
    Description: TicketDesk backend security group ID
    Value: !Ref BackendSecurityGroup
    Export:
      Name: TicketDesk-BackendSecurityGroup

  RDSecurityGroupId:
    Description: TicketDesk RDS security group ID
    Value: !Ref RDSecurityGroup
    Export:
      Name: TicketDesk-RDSecurityGroup